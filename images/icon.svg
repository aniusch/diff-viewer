<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2640"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#7cc4ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="8" y="8" width="240" height="240" rx="52"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>

  <g clip-path="url(#clip)">
    <!-- context row -->
    <rect x="44" y="50" width="120" height="12" rx="6" fill="#5b6b86"/>

    <!-- removed rows -->
    <rect x="30" y="78" width="196" height="32" rx="9" fill="#f85149" fill-opacity="0.2"/>
    <rect x="42" y="91" width="18" height="6" rx="3" fill="#ff6b62"/>
    <rect x="74" y="88" width="128" height="12" rx="6" fill="#ff6b62"/>

    <rect x="30" y="116" width="196" height="32" rx="9" fill="#f85149" fill-opacity="0.2"/>
    <rect x="42" y="129" width="18" height="6" rx="3" fill="#ff6b62"/>
    <rect x="74" y="126" width="88" height="12" rx="6" fill="#ff6b62"/>

    <!-- added rows -->
    <rect x="30" y="154" width="196" height="32" rx="9" fill="#3fb950" fill-opacity="0.22"/>
    <rect x="42" y="167" width="18" height="6" rx="3" fill="#56d364"/>
    <rect x="48" y="161" width="6" height="18" rx="3" fill="#56d364"/>
    <rect x="74" y="164" width="140" height="12" rx="6" fill="#56d364"/>

    <rect x="30" y="192" width="196" height="32" rx="9" fill="#3fb950" fill-opacity="0.22"/>
    <rect x="42" y="205" width="18" height="6" rx="3" fill="#56d364"/>
    <rect x="48" y="199" width="6" height="18" rx="3" fill="#56d364"/>
    <rect x="74" y="202" width="104" height="12" rx="6" fill="#56d364"/>

    <!-- slanted glass pane drifting across the diff -->
    <g transform="rotate(-24 128 128)">
      <rect x="112" y="-40" width="82" height="336" fill="url(#glass)"/>
      <rect x="112" y="-40" width="3" height="336" fill="#e6f4ff" fill-opacity="0.75"/>
      <rect x="191" y="-40" width="2" height="336" fill="#e6f4ff" fill-opacity="0.35"/>
      <rect x="124" y="-40" width="14" height="336" fill="url(#sheen)" opacity="0.35"/>
    </g>
  </g>

  <rect x="9" y="9" width="238" height="238" rx="51" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
